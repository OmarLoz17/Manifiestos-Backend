name: sistema-manifiestos
services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: manifiestos
      POSTGRES_USER: manifiestos_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TZ: UTC
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database:/workspace/database:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manifiestos_owner -d manifiestos"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
secrets:
  postgres_password:
    file: ./.local/postgres_password
volumes:
  postgres_data:

