# Solo ensayo: TLS autofirmado delante de las mismas rutas que sirve el puerto 8080.
server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/locations.inc;
}
